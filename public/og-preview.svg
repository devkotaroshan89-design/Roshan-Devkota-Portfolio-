<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#080b11; font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="neonGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.16" />
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#080b11" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#0891b2" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#080b11" stop-opacity="0.95" />
    </radialGradient>
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#06b6d4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="cyanFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="#080b11" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#neonGlow)" />

  <!-- Outer Viewfinder Framing & Ticks -->
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />
  <path d="M 36 72 L 36 36 L 72 36" fill="none" stroke="#06b6d4" stroke-width="3" />
  <path d="M 1128 36 L 1164 36 L 1164 72" fill="none" stroke="#06b6d4" stroke-width="3" />
  <path d="M 36 558 L 36 594 L 72 594" fill="none" stroke="#06b6d4" stroke-width="3" />
  <path d="M 1164 558 L 1164 594 L 1128 594" fill="none" stroke="#06b6d4" stroke-width="3" />

  <!-- HUD Top Data Bar -->
  <g transform="translate(68, 70)">
    <circle cx="8" cy="8" r="5" fill="#ef4444" />
    <text x="24" y="12" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">REC // 4K 60FPS</text>
    <text x="240" y="12" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5">LOCATION: BUTWAL-06, NEPAL</text>
    <text x="560" y="12" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5">FPS: 59.94 · DCI 4K RAW · ACEScc</text>
    <text x="920" y="12" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1.5">PORTFOLIO VAULT</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(70, 150)">
    <!-- Small Category Label -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="32" rx="8" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
      <text x="14" y="21" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">PRODUCTION ARCHIVE</text>
      <circle cx="212" cy="16" r="3" fill="#22d3ee" />
    </g>

    <!-- Main Name Title -->
    <text x="0" y="96" fill="#ffffff" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      ROSHAN DEVKOTA
    </text>

    <!-- Subtitle / Headline -->
    <text x="2" y="146" fill="url(#cyanViolet)" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">
      Multimedia Specialist &amp; Video Editor
    </text>

    <!-- Value Statement -->
    <text x="2" y="196" fill="#94a3b8" font-size="16" font-weight="400" width="540">
      Cinematic Video Production · High-Retention Reels · Motion Graphics
    </text>
    <text x="2" y="224" fill="#94a3b8" font-size="16" font-weight="400">
      Data-Backed SEO &amp; Growth Marketing Strategy · Islington Tech Alum
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 270)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" fill="#f8fafc" font-size="13" font-weight="600">Premiere &amp; DaVinci</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(172, 0)">
        <rect x="0" y="0" width="145" height="42" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="18" y="26" fill="#f8fafc" font-size="13" font-weight="600">4K Cinema Rigs</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(329, 0)">
        <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1" />
        <text x="18" y="26" fill="#22d3ee" font-size="13" font-weight="600">AITC Certified SEO</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Apparatus: 3D Cinema Shutter & Aperture Mechanism (Zero Personal Face Photos) -->
  <g transform="translate(900, 335)">
    <!-- Ambient Behind Glow -->
    <circle cx="0" cy="0" r="190" fill="#06b6d4" fill-opacity="0.14" filter="url(#cyanFilter)" />

    <!-- Outer Gear Wheel -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="16 8" />
    <circle cx="0" cy="0" r="155" fill="none" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="2" />
    <circle cx="0" cy="0" r="142" fill="#0b0f19" stroke="#334155" stroke-width="2" />

    <!-- Aperture Blades (8-blade mechanical iris) -->
    <g transform="rotate(25)">
      <path d="M 0,-130 L 75,-65 L 45,0 Z" fill="#111827" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M 0,-130 L 75,-65 L 45,0 Z" transform="rotate(45)" fill="#111827" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M 0,-130 L 75,-65 L 45,0 Z" transform="rotate(90)" fill="#111827" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M 0,-130 L 75,-65 L 45,0 Z" transform="rotate(135)" fill="#111827" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M 0,-130 L 75,-65 L 45,0 Z" transform="rotate(180)" fill="#111827" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M 0,-130 L 75,-65 L 45,0 Z" transform="rotate(225)" fill="#111827" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M 0,-130 L 75,-65 L 45,0 Z" transform="rotate(270)" fill="#111827" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
      <path d="M 0,-130 L 75,-65 L 45,0 Z" transform="rotate(315)" fill="#111827" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" />
    </g>

    <!-- Center Deep Optical Glass Element -->
    <circle cx="0" cy="0" r="70" fill="url(#lensGlow)" stroke="#22d3ee" stroke-width="2.5" />
    <circle cx="0" cy="0" r="32" fill="#04060a" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="-14" cy="-14" r="9" fill="#ffffff" fill-opacity="0.65" />
    <circle cx="16" cy="18" r="4" fill="#22d3ee" fill-opacity="0.75" />

    <!-- Crosshair Target -->
    <line x1="-85" y1="0" x2="-45" y2="0" stroke="#22d3ee" stroke-width="2" />
    <line x1="45" y1="0" x2="85" y2="0" stroke="#22d3ee" stroke-width="2" />
    <line x1="0" y1="-85" x2="0" y2="-45" stroke="#22d3ee" stroke-width="2" />
    <line x1="0" y1="45" x2="0" y2="85" stroke="#22d3ee" stroke-width="2" />

    <!-- Orbiting Satellite Card: 4K Cinema -->
    <g transform="translate(-165, -135)">
      <rect x="0" y="0" width="135" height="38" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="1" />
      <text x="14" y="24" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">4K CINEMA RIG</text>
    </g>

    <!-- Orbiting Satellite Card: DaVinci Resolve -->
    <g transform="translate(65, 115)">
      <rect x="0" y="0" width="145" height="38" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="1" />
      <text x="14" y="24" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DAVINCI &amp; PREMIERE</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <g transform="translate(70, 560)">
    <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">
      CONTACT: devkotaroshan89@gmail.com · +977-9866144098 · TRAFFICK CHOWK, BUTWAL
    </text>
    <text x="890" y="0" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">
      EXPLORE PORTFOLIO VAULT ➔
    </text>
  </g>
</svg>
